<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SAMS | Login</title>


<style>
    :root {
        --forest: #183C2B;
        --forest-light: #28573F;
        --ivory: #F7F7F0;
        --white: #FFFFFF;
        --text: #24332B;
        --muted: #718078;
        --border: #DDE3DE;
        --error: #A94B4B;
    }

    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: var(--ivory);
        font-family:
            Inter,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            sans-serif;
        color: var(--text);
    }

    .login-wrapper {
        width: 100%;
        max-width: 430px;
        padding: 24px;
    }

    .brand {
        text-align: center;
        margin-bottom: 28px;
    }

    .logo {
        width: 58px;
        height: 58px;
        margin: 0 auto 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        border-radius: 18px;
        background: var(--forest);
        color: white;
        font-size: 27px;
        font-weight: 700;
        box-shadow:
            0 12px 30px rgba(24, 60, 43, 0.16);
    }

    .brand h1 {
        margin: 0;
        color: var(--forest);
        font-size: 25px;
        letter-spacing: -0.5px;
    }

    .brand p {
        margin: 7px 0 0;
        color: var(--muted);
        font-size: 14px;
    }

    .login-card {
        background: var(--white);
        border: 1px solid var(--border);
        border-radius: 20px;
        padding: 30px;
        box-shadow:
            0 18px 45px rgba(24, 60, 43, 0.08);
    }

    .login-card h2 {
        margin: 0 0 6px;
        color: var(--text);
        font-size: 21px;
    }

    .login-card .subtitle {
        margin: 0 0 22px;
        color: var(--muted);
        font-size: 14px;
    }

    /* ROLE TOGGLE */

    .role-label {
        display: block;
        margin-bottom: 8px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
    }

    .role-toggle {
        display: grid;
        grid-template-columns: 1fr 1fr;
        padding: 4px;
        margin-bottom: 20px;
        background: #F1F4F1;
        border: 1px solid var(--border);
        border-radius: 11px;
        gap: 4px;
    }

    .role-option {
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: transparent;
        color: var(--muted);
        font-size: 13px;
        font-weight: 600;
        cursor: pointer;
        transition:
            background 0.2s,
            color 0.2s,
            box-shadow 0.2s;
    }

    .role-option.active {
        background: var(--white);
        color: var(--forest);
        box-shadow:
            0 2px 8px rgba(24, 60, 43, 0.08);
    }

    .field {
        margin-bottom: 18px;
    }

    label {
        display: block;
        margin-bottom: 7px;
        font-size: 13px;
        font-weight: 600;
        color: var(--text);
    }

    input {
        width: 100%;
        padding: 13px 14px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #FCFCF8;
        color: var(--text);
        font-size: 14px;
        outline: none;
        transition:
            border-color 0.2s,
            box-shadow 0.2s;
    }

    input:focus {
        border-color: var(--forest-light);
        box-shadow:
            0 0 0 3px rgba(40, 87, 63, 0.10);
    }

    .login-button {
        width: 100%;
        padding: 13px;
        border: none;
        border-radius: 10px;
        background: var(--forest);
        color: white;
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
        transition:
            background 0.2s,
            transform 0.15s;
    }

    .login-button:hover {
        background: var(--forest-light);
    }

    .login-button:active {
        transform: translateY(1px);
    }

    .message {
        display: none;
        margin-bottom: 18px;
        padding: 11px 13px;
        border-radius: 9px;
        background: #FFF3F3;
        border: 1px solid #F0D2D2;
        color: var(--error);
        font-size: 13px;
    }
</style>


</head>

<body>

<div class="login-wrapper">


<div class="brand">
    <div class="logo">S</div>

    <h1>SAMS</h1>

    <p>
        Student Achievement Management System
    </p>
</div>

<div class="login-card">

    <h2>Welcome back</h2>

    <p class="subtitle">
        Sign in to continue to your dashboard.
    </p>

    <div
        id="errorMessage"
        class="message"
    ></div>

    <form
        action="login"
        method="post"
    >

        <span class="role-label">
            Login as
        </span>

        <div class="role-toggle">

            <button
                type="button"
                id="studentButton"
                class="role-option active"
                onclick="selectRole('STUDENT')"
            >
                Student
            </button>

            <button
                type="button"
                id="evaluatorButton"
                class="role-option"
                onclick="selectRole('EVALUATOR')"
            >
                Evaluator
            </button>

        </div>

        <input
            type="hidden"
            id="role"
            name="role"
            value="STUDENT"
        >

        <div class="field">

            <label for="username">
                Username
            </label>

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter your username"
                autocomplete="username"
                required
            >

        </div>

        <div class="field">

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
            >

        </div>

        <button
            type="submit"
            class="login-button"
        >
            Sign In
        </button>

    </form>
</div>
</div>

<script>

    function selectRole(role) {

        const roleInput =
            document.getElementById("role");

        const studentButton =
            document.getElementById("studentButton");

        const evaluatorButton =
            document.getElementById("evaluatorButton");

        roleInput.value = role;

        if (role === "STUDENT") {

            studentButton.classList.add("active");
            evaluatorButton.classList.remove("active");

        } else {

            evaluatorButton.classList.add("active");
            studentButton.classList.remove("active");

        }
    }

    const params =
        new URLSearchParams(
            window.location.search
        );

    const error =
        params.get("error");

    const logout =
        params.get("logout");

    const message =
        document.getElementById(
            "errorMessage"
        );

    if (error === "invalid") {

        message.textContent =
            "Invalid username or password.";

        message.style.display =
            "block";

    } else if (error === "missing") {

        message.textContent =
            "Please enter your username and password.";

        message.style.display =
            "block";

    } else if (error === "role") {

        message.textContent =
            "The selected login type does not match this account.";

        message.style.display =
            "block";

    } else if (logout === "true") {

        message.textContent =
            "You have been logged out.";

        message.style.display =
            "block";
    }

</script>

</body>
</html>
